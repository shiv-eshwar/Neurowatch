name: Deploy NeuroWatch To Cloud Run

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.11"
      NODE_VERSION: "20"
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      CLOUD_RUN_RUNTIME_SA: ${{ secrets.CLOUD_RUN_RUNTIME_SA }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Prepare static assets for backend source deploy
        run: |
          mkdir -p backend/frontend/dist
          rsync -a --delete frontend/dist/ backend/frontend/dist/

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Ensure Secret Manager values exist
        run: |
          for secret_name in DATABASE_URL JWT_SECRET OPENAI_API_KEY FIREBASE_SERVICE_ACCOUNT_JSON; do
            if ! gcloud secrets describe "$secret_name" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
              gcloud secrets create "$secret_name" --replication-policy=automatic --project "$GCP_PROJECT_ID"
            fi
          done

          echo -n "${{ secrets.DATABASE_URL }}" | gcloud secrets versions add DATABASE_URL --data-file=- --project "$GCP_PROJECT_ID"
          echo -n "${{ secrets.JWT_SECRET }}" | gcloud secrets versions add JWT_SECRET --data-file=- --project "$GCP_PROJECT_ID"
          echo -n "${{ secrets.OPENAI_API_KEY }}" | gcloud secrets versions add OPENAI_API_KEY --data-file=- --project "$GCP_PROJECT_ID"
          echo -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" | gcloud secrets versions add FIREBASE_SERVICE_ACCOUNT_JSON --data-file=- --project "$GCP_PROJECT_ID"

      - name: Grant runtime service account access to secrets
        if: ${{ env.CLOUD_RUN_RUNTIME_SA != '' }}
        run: |
          for secret_name in DATABASE_URL JWT_SECRET OPENAI_API_KEY FIREBASE_SERVICE_ACCOUNT_JSON; do
            gcloud secrets add-iam-policy-binding "$secret_name" \
              --member="serviceAccount:${CLOUD_RUN_RUNTIME_SA}" \
              --role="roles/secretmanager.secretAccessor" \
              --project "$GCP_PROJECT_ID"
          done

      - name: Deploy to Cloud Run from source
        run: |
          DEPLOY_CMD=(
            gcloud run deploy "$CLOUD_RUN_SERVICE"
            --project "$GCP_PROJECT_ID"
            --region "$GCP_REGION"
            --source backend
            --allow-unauthenticated
            --set-env-vars "ENVIRONMENT=production,AUTH_PROVIDER=firebase,CORS_ORIGINS=${CORS_ORIGINS},FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID},VITE_AUTH_PROVIDER=firebase"
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,FIREBASE_SERVICE_ACCOUNT_JSON=FIREBASE_SERVICE_ACCOUNT_JSON:latest"
            --quiet
          )
          if [ -n "$CLOUD_RUN_RUNTIME_SA" ]; then
            DEPLOY_CMD+=(--service-account "$CLOUD_RUN_RUNTIME_SA")
          fi
          "${DEPLOY_CMD[@]}"
